name: Temporary runtime streaming fix runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/runtime-streaming-20260902'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply staged patch and fixups
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-runtime-streaming-runner.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install development dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'runtime-streaming-implementation', 'exec'))

          path = Path('micro_agent/models/openai_compat.py')
          text = path.read_text()
          text = text.replace(
              'from collections.abc import AsyncIterator\nfrom dataclasses import dataclass, field\nimport json\n',
              'import json\nfrom collections.abc import AsyncIterator\nfrom dataclasses import dataclass, field\n',
          )
          path.write_text(text)

          path = Path('runtimes/adk/runtime.py')
          text = path.read_text()
          text = text.replace(
              'from collections.abc import Awaitable\n',
              'from collections.abc import AsyncIterator, Awaitable, Callable\n',
              1,
          )
          text = text.replace(
              '    ModelConfig,\n    ModelProvider,\n',
              '    ModelConfig,\n    ModelProvider,\n    ModelResponse,\n',
              1,
          )
          text = text.replace(
              '                    async def consume_stream():\n',
              '                    async def consume_stream() -> ModelResponse:\n',
              1,
          )
          path.write_text(text)

          path = Path('micro_agent/models/fake.py')
          text = path.read_text()
          text = text.replace(
              'from dataclasses import dataclass, field\n',
              'from collections.abc import AsyncIterator\nfrom dataclasses import dataclass, field\n',
              1,
          )
          text = text.replace(
              '    async def stream(\n        self,\n        config: ModelConfig,\n        messages: list[dict[str, Any]],\n        tools: list[dict[str, Any]] | None = None,\n    ):\n',
              '    async def stream(\n        self,\n        config: ModelConfig,\n        messages: list[dict[str, Any]],\n        tools: list[dict[str, Any]] | None = None,\n    ) -> AsyncIterator[ModelStreamEvent]:\n',
              1,
          )
          path.write_text(text)

          path = Path('micro_agent/interoperability/http_api.py')
          text = path.read_text()
          text = text.replace(
              'from collections.abc import Awaitable, Callable, Sequence\n',
              'from collections.abc import AsyncIterator, Awaitable, Callable, Sequence\n',
              1,
          )
          text = text.replace(
              'async def _stream_invoke(agent: DefaultMicroAgent, request: AgentRequest, telemetry: Telemetry):\n',
              'async def _stream_invoke(\n    agent: DefaultMicroAgent, request: AgentRequest, telemetry: Telemetry\n) -> AsyncIterator[str]:\n',
              1,
          )
          path.write_text(text)
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Format and fix imports
        run: |
          ruff format micro_agent/models/model.py micro_agent/models/__init__.py micro_agent/models/fake.py micro_agent/models/openai_compat.py micro_agent/core/agent.py micro_agent/core/__init__.py micro_agent/core/default_agent.py micro_agent/runtime/runtime.py runtimes/adk/runtime.py micro_agent/interoperability/http_api.py tests/test_streaming.py
          ruff check --fix micro_agent/models/openai_compat.py micro_agent/models/fake.py runtimes/adk/runtime.py micro_agent/interoperability/http_api.py tests/test_streaming.py
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy micro_agent runtimes
      - name: Focused streaming tests
        run: pytest tests/test_streaming.py -q
      - name: Default tests
        run: pytest -m "not integration and not e2e and not otel and not adk" -q
      - name: Commit implementation and remove temporary workflows
        run: |
          git rm .github/workflows/temporary-runtime-streaming-runner.yml
          git rm .github/workflows/temporary-runtime-streaming-fix-runner.yml
          git add micro_agent runtimes tests TODO.md CHANGELOG.md docs/STREAMING.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add truthful runtime streaming"
          git pull --rebase origin feat/runtime-streaming-20260902
          git push origin HEAD:feat/runtime-streaming-20260902
