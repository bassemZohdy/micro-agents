name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,docs]" build
      - name: Validate tag and package version
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy micro_agent runtimes
      - run: pytest -q
      - run: python -m micro_agent.definition.schema
      - run: git diff --exit-code docs/schemas/
      - run: mkdocs build --strict
      - run: pip-audit --skip-editable
      - run: python -m build
      - name: Container smoke test
        run: |
          cleanup() { docker rm -f micro-agent-release > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build -t micro-agent:release .
          docker run --rm -d --name micro-agent-release \
            -p 8080:8080 \
            -v "$PWD/examples/notification-agent.yaml:/etc/micro-agent/agent.yaml:ro" \
            micro-agent:release
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs micro-agent-release
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: micro-agents-sbom.spdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            micro-agents-sbom.spdx.json
