name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,docs]" build
      - name: Validate tag, package version, schemas, rollback, image tag, and changelog
        run: python tools/validate_release.py "${GITHUB_REF_NAME#v}"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy micro_agent cloud runtimes
      - run: pytest -q
      - run: python -m micro_agent.definition.schema
      - run: git diff --exit-code docs/schemas/
      - run: mkdocs build --strict
      - run: pip-audit --skip-editable
      - run: python -m build
      - name: Container smoke test
        run: |
          cleanup() { docker rm -f micro-agent-release > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build -t micro-agent:release .
          docker run --rm -d --name micro-agent-release \
            -p 8080:8080 \
            -v "$PWD/examples/notification-agent.yaml:/etc/micro-agent/agent.yaml:ro" \
            micro-agent:release
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs micro-agent-release
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image-build.outputs.digest }}

      - name: Attest distribution build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: micro-agents-sbom.spdx.json

      - name: Attest and verify image SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate micro-agents-sbom.spdx.json \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            micro-agents-sbom.spdx.json

  publish-dockerhub:
    name: Publish image to Docker Hub (opt-in)
    if: vars.ENABLE_DOCKERHUB_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/micro-agents
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify Docker Hub image
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/micro-agents
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"

      - name: Attest Docker Hub image provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/micro-agents
          subject-digest: ${{ steps.image-build.outputs.digest }}

      - name: Generate Docker Hub image SBOM
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/micro-agents
          DIGEST: ${{ steps.image-build.outputs.digest }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: dockerhub-micro-agents-sbom.spdx.json

      - name: Attest and verify Docker Hub image SBOM
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/micro-agents
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate dockerhub-micro-agents-sbom.spdx.json \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"
