name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,docs]" build
      - name: Validate tag, package version, schemas, rollback, image tag, and changelog
        run: python tools/validate_release.py "${GITHUB_REF_NAME#v}"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy micro_agent cloud runtimes
      - run: pytest -q
      - run: python -m micro_agent.definition.schema
      - run: git diff --exit-code docs/schemas/
      - run: mkdocs build --strict
      - run: pip-audit --skip-editable
      - run: python -m build
      - name: Container smoke test
        run: |
          cleanup() { docker rm -f micro-agent-release > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build -t micro-agent:release .
          docker run --rm -d --name micro-agent-release \
            -p 8080:8080 \
            -v "$PWD/examples/notification-agent.yaml:/etc/micro-agent/agent.yaml:ro" \
            micro-agent:release
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs micro-agent-release
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Normalize GHCR image name
        id: ghcr_image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr_image.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify image
        env:
          IMAGE: ${{ steps.ghcr_image.outputs.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.ghcr_image.outputs.image }}
          subject-digest: ${{ steps.image-build.outputs.digest }}

      - name: Attest distribution build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: micro-agents-sbom.spdx.json

      - name: Attest and verify image SBOM
        env:
          IMAGE: ${{ steps.ghcr_image.outputs.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate micro-agents-sbom.spdx.json \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}" \
            > ghcr-micro-agents-sbom-attestation.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            micro-agents-sbom.spdx.json

  publish-dockerhub:
    name: Publish image to Docker Hub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Normalize Docker Hub image name
        id: dockerhub_image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          namespace="${DOCKERHUB_USERNAME,,}"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/${namespace}/micro-agents" >> "$GITHUB_OUTPUT"

      - name: Ensure Docker Hub repository exists
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ steps.dockerhub_image.outputs.namespace }}
        run: |
          set -euo pipefail

          api_token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -n \
              --arg identifier "$DOCKERHUB_USERNAME" \
              --arg secret "$DOCKERHUB_TOKEN" \
              '{identifier: $identifier, secret: $secret}')" \
            https://hub.docker.com/v2/auth/token | jq -er '.access_token')"
          repo_url="https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/micro-agents"
          repo_response="$(mktemp)"
          create_response="$(mktemp)"
          trap 'rm -f "$repo_response" "$create_response"' EXIT

          repo_status="$(curl --silent --show-error \
            --output "$repo_response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $api_token" \
            "$repo_url")"
          case "$repo_status" in
            200)
              jq -e '.is_private == false' "$repo_response" > /dev/null || {
                echo "Docker Hub repository must be public: $repo_url" >&2
                exit 1
              }
              echo "Docker Hub repository already exists and is public: $repo_url"
              ;;
            404)
              create_status="$(curl --silent --show-error \
                --output "$create_response" \
                --write-out '%{http_code}' \
                --request POST \
                --header 'Content-Type: application/json' \
                --header "Authorization: Bearer $api_token" \
                --data "$(jq -n \
                  --arg name 'micro-agents' \
                  --arg namespace "$DOCKERHUB_NAMESPACE" \
                  '{name: $name, namespace: $namespace, description: "Micro-Agents self-hosted AI agent reference framework", is_private: false}')" \
                "https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories")"
              case "$create_status" in
                201)
                  echo "Created public Docker Hub repository: $repo_url"
                  ;;
                409)
                  echo "Docker Hub repository was created concurrently; verifying it."
                  verify_status="$(curl --silent --show-error \
                    --output "$repo_response" \
                    --write-out '%{http_code}' \
                    --header "Authorization: Bearer $api_token" \
                    "$repo_url")"
                  test "$verify_status" = 200 || {
                    echo "Docker Hub repository verification failed with HTTP $verify_status" >&2
                    cat "$repo_response" >&2
                    exit 1
                  }
                  jq -e '.is_private == false' "$repo_response" > /dev/null || {
                    echo "Docker Hub repository must be public: $repo_url" >&2
                    exit 1
                  }
                  ;;
                *)
                  echo "Docker Hub repository creation failed with HTTP $create_status" >&2
                  cat "$create_response" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Docker Hub repository lookup failed with HTTP $repo_status" >&2
              cat "$repo_response" >&2
              exit 1
              ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub_image.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign and verify Docker Hub image
        env:
          IMAGE: ${{ steps.dockerhub_image.outputs.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}"

      - name: Attest Docker Hub image provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.dockerhub_image.outputs.image }}
          subject-digest: ${{ steps.image-build.outputs.digest }}

      - name: Generate Docker Hub image SBOM
        env:
          IMAGE: ${{ steps.dockerhub_image.outputs.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: dockerhub-micro-agents-sbom.spdx.json
          upload-release-assets: false

      - name: Attest and verify Docker Hub image SBOM
        env:
          IMAGE: ${{ steps.dockerhub_image.outputs.image }}
          DIGEST: ${{ steps.image-build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate dockerhub-micro-agents-sbom.spdx.json \
            "${IMAGE}@${DIGEST}"
          # Keep the large attestation payload out of stdout. GitHub-hosted
          # runners can spend minutes secret-scanning that output.
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            "${IMAGE}@${DIGEST}" \
            > dockerhub-micro-agents-sbom-attestation.json
