name: Temporary knowledge PR runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/knowledge-retrieval-semantics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('.github/workflows/temporary-knowledge-implementation.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install development dependencies"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, 'knowledge-implementation', 'exec'))
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Format changed Python files
        run: >-
          ruff format micro_agent/definition/models.py micro_agent/knowledge/knowledge.py
          micro_agent/knowledge/__init__.py runtimes/adk/runtime.py
          runtimes/google_adk/runtime.py tests/test_knowledge_retrieval.py
          tests/test_google_adk_runtime.py
      - name: Regenerate schema
        run: python -m micro_agent.definition.schema
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy micro_agent runtimes
      - name: Default tests
        run: pytest -m "not integration and not e2e and not otel and not adk" -q
      - name: Install Google ADK extra
        run: python -m pip install -e ".[adk]"
      - name: Google ADK tests
        run: pytest -m adk tests/test_google_adk_runtime.py -q
      - name: Commit implementation and remove temporary workflows
        run: |
          git rm .github/workflows/temporary-knowledge-implementation.yml
          git rm .github/workflows/temporary-knowledge-pr-runner.yml
          git add micro_agent runtimes tests docs TODO.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: define knowledge retrieval semantics"
          git push origin HEAD:feat/knowledge-retrieval-semantics
