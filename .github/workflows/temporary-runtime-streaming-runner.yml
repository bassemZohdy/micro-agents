name: Temporary runtime streaming runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/runtime-streaming-20260902'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply streaming patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # Model SPI: optional streaming event contract.
          path = Path('micro_agent/models/model.py')
          text = path.read_text()
          text = text.replace('from abc import ABC, abstractmethod\n', 'from abc import ABC, abstractmethod\nfrom collections.abc import AsyncIterator\n')
          marker = '''@dataclass\nclass ModelResponse:\n    """Response from a model invocation."""\n\n    content: str = ""\n    tool_requests: list[dict[str, Any]] = field(default_factory=list)\n    finish_reason: str = "stop"\n    usage: dict[str, int] = field(default_factory=dict)\n    metadata: dict[str, Any] = field(default_factory=dict)\n'''
          addition = marker + '''\n\n@dataclass\nclass ModelStreamEvent:\n    """One provider stream event; the final event carries the full response."""\n\n    delta: str = ""\n    response: ModelResponse | None = None\n'''
          if marker not in text:
              raise SystemExit('ModelResponse marker not found')
          text = text.replace(marker, addition, 1)
          marker = '''    @abstractmethod\n    async def health_check(self) -> bool:\n        """Check if the model provider is available."""\n'''
          addition = '''    async def stream(\n        self,\n        config: ModelConfig,\n        messages: list[dict[str, Any]],\n        tools: list[dict[str, Any]] | None = None,\n    ) -> AsyncIterator[ModelStreamEvent]:\n        """Stream model output when ``capabilities().streaming`` is true."""\n        raise NotImplementedError("model provider does not implement streaming")\n        yield ModelStreamEvent()  # pragma: no cover - marks this as an async generator\n\n''' + marker
          if marker not in text:
              raise SystemExit('health marker not found')
          path.write_text(text.replace(marker, addition, 1))

          # Public model exports.
          path = Path('micro_agent/models/__init__.py')
          text = path.read_text()
          text = text.replace('    ModelResponse,\n', '    ModelResponse,\n    ModelStreamEvent,\n')
          text = text.replace('    "ModelResponse",\n', '    "ModelResponse",\n    "ModelStreamEvent",\n')
          path.write_text(text)

          # Fake provider gets opt-in deterministic streaming for CI without changing default capabilities.
          path = Path('micro_agent/models/fake.py')
          text = path.read_text()
          text = text.replace('    ModelResponse,\n', '    ModelResponse,\n    ModelStreamEvent,\n')
          text = text.replace('    usage: dict[str, int] = field(\n', '    stream_chunks: list[str] | None = None\n    usage: dict[str, int] = field(\n')
          marker = '''    def capabilities(self) -> ProviderCapabilities:\n        """The deterministic provider exercises tool calling in tests."""\n        return ProviderCapabilities(tool_use=True)\n'''
          replacement = '''    async def stream(\n        self,\n        config: ModelConfig,\n        messages: list[dict[str, Any]],\n        tools: list[dict[str, Any]] | None = None,\n    ):\n        """Emit configured deterministic chunks and a complete final response."""\n        if self._config.stream_chunks is None:\n            raise NotImplementedError("fake streaming is not configured")\n        self._invocations.append({"config": config, "messages": messages, "tools": tools})\n        if self._config.should_error:\n            raise RuntimeError(self._config.error_message)\n        content = ""\n        for chunk in self._config.stream_chunks:\n            content += chunk\n            yield ModelStreamEvent(delta=chunk)\n        yield ModelStreamEvent(\n            response=ModelResponse(\n                content=content,\n                tool_requests=list(self._config.tool_requests),\n                finish_reason="stop",\n                usage=dict(self._config.usage),\n            )\n        )\n\n    def capabilities(self) -> ProviderCapabilities:\n        """Report only features implemented by this configured fake provider."""\n        return ProviderCapabilities(\n            tool_use=True,\n            streaming=self._config.stream_chunks is not None,\n        )\n'''
          if marker not in text:
              raise SystemExit('fake capability marker not found')
          path.write_text(text.replace(marker, replacement, 1))

          # OpenAI-compatible SSE implementation, including streamed tool-call reconstruction.
          path = Path('micro_agent/models/openai_compat.py')
          text = path.read_text()
          text = text.replace('from dataclasses import dataclass, field\n', 'from collections.abc import AsyncIterator\nfrom dataclasses import dataclass, field\nimport json\n')
          text = text.replace('    ModelResponse,\n', '    ModelResponse,\n    ModelStreamEvent,\n')
          marker = '''    def capabilities(self) -> ProviderCapabilities:\n        """Report the chat-completions features this adapter actually wires."""\n        return ProviderCapabilities(tool_use=True, structured_output=True)\n'''
          streaming = '''    async def stream(\n        self,\n        config: ModelConfig,\n        messages: list[dict[str, Any]],\n        tools: list[dict[str, Any]] | None = None,\n    ) -> AsyncIterator[ModelStreamEvent]:\n        """Stream OpenAI-compatible SSE chat-completion deltas."""\n        headers: dict[str, str] = {}\n        if self._config.telemetry is not None:\n            self._config.telemetry.inject_context(headers)\n        payload = self._payload(config, messages, tools)\n        payload["stream"] = True\n        content_parts: list[str] = []\n        tool_calls: dict[int, dict[str, Any]] = {}\n        finish_reason = "stop"\n        usage: dict[str, int] = {}\n        async with self._client.stream(\n            "POST",\n            f"{self._endpoint}/chat/completions",\n            json=payload,\n            headers=headers or None,\n        ) as response:\n            response.raise_for_status()\n            async for line in response.aiter_lines():\n                if not line.startswith("data:"):\n                    continue\n                raw = line[5:].strip()\n                if not raw or raw == "[DONE]":\n                    continue\n                data = json.loads(raw)\n                if isinstance(data.get("usage"), dict):\n                    usage = {str(k): int(v) for k, v in data["usage"].items() if isinstance(v, int)}\n                choice = (data.get("choices") or [{}])[0]\n                delta = choice.get("delta") or {}\n                content = delta.get("content")\n                if isinstance(content, str) and content:\n                    content_parts.append(content)\n                    yield ModelStreamEvent(delta=content)\n                for call in delta.get("tool_calls") or []:\n                    index = int(call.get("index", 0))\n                    state = tool_calls.setdefault(\n                        index, {"id": None, "name": "", "arguments": ""}\n                    )\n                    if call.get("id"):\n                        state["id"] = call["id"]\n                    function = call.get("function") or {}\n                    if function.get("name"):\n                        state["name"] += str(function["name"])\n                    if function.get("arguments"):\n                        state["arguments"] += str(function["arguments"])\n                if choice.get("finish_reason"):\n                    finish_reason = str(choice["finish_reason"])\n        requests = [\n            {\n                "id": state.get("id"),\n                "name": state.get("name", ""),\n                "arguments": _parse_arguments(state.get("arguments")),\n            }\n            for _, state in sorted(tool_calls.items())\n        ]\n        yield ModelStreamEvent(\n            response=ModelResponse(\n                content="".join(content_parts),\n                tool_requests=requests,\n                finish_reason=finish_reason,\n                usage=usage,\n            )\n        )\n\n    def capabilities(self) -> ProviderCapabilities:\n        """Report the chat-completions features this adapter actually wires."""\n        return ProviderCapabilities(tool_use=True, streaming=True, structured_output=True)\n'''
          if marker not in text:
              raise SystemExit('openai capability marker not found')
          text = text.replace(marker, streaming, 1)
          text = text.replace('        import json\n\n        try:\n', '        try:\n')
          path.write_text(text)

          # Core stream event and non-breaking optional MicroAgent stream method.
          path = Path('micro_agent/core/agent.py')
          text = path.read_text()
          text = text.replace('from abc import ABC, abstractmethod\n', 'from abc import ABC, abstractmethod\nfrom collections.abc import AsyncIterator\n')
          marker = '''@dataclass\nclass AgentResponse:\n    """A response from a Micro-Agent invocation."""\n\n    output: dict[str, Any] = field(default_factory=dict)\n    request_id: str = ""\n    session_id: str | None = None\n    status: str = "success"\n    error: str | None = None\n    metadata: dict[str, Any] = field(default_factory=dict)\n'''
          addition = marker + '''\n\n@dataclass\nclass AgentStreamEvent:\n    """One runtime-neutral streaming event."""\n\n    delta: str = ""\n    response: AgentResponse | None = None\n'''
          if marker not in text:
              raise SystemExit('AgentResponse marker not found')
          text = text.replace(marker, addition, 1)
          marker = '''    @abstractmethod\n    async def stop(self) -> None:\n        """Stop the agent gracefully. Transition to STOPPED."""\n'''
          addition = '''    async def stream(self, request: AgentRequest) -> AsyncIterator[AgentStreamEvent]:\n        """Stream an invocation when the selected runtime supports it."""\n        raise NotImplementedError("agent runtime does not implement streaming")\n        yield AgentStreamEvent()  # pragma: no cover\n\n''' + marker
          if marker not in text:
              raise SystemExit('MicroAgent stop marker not found')
          path.write_text(text.replace(marker, addition, 1))

          path = Path('micro_agent/core/__init__.py')
          text = path.read_text().replace('    AgentState,\n', '    AgentState,\n    AgentStreamEvent,\n')
          text = text.replace('    "AgentState",\n', '    "AgentState",\n    "AgentStreamEvent",\n')
          path.write_text(text)

          # Runtime SPI optional stream method.
          path = Path('micro_agent/runtime/runtime.py')
          text = path.read_text()
          text = text.replace('from abc import ABC, abstractmethod\n', 'from abc import ABC, abstractmethod\nfrom collections.abc import AsyncIterator\n')
          text = text.replace('    AgentResponse,\n', '    AgentResponse,\n    AgentStreamEvent,\n')
          marker = '''    @abstractmethod\n    async def stop(self, agent: RuntimeAgent) -> None:\n        """Stop the runtime agent gracefully."""\n'''
          addition = '''    async def stream(\n        self, agent: RuntimeAgent, request: AgentRequest\n    ) -> AsyncIterator[AgentStreamEvent]:\n        """Stream one invocation when ``capabilities().streaming`` is true."""\n        raise NotImplementedError("runtime does not implement streaming")\n        yield AgentStreamEvent()  # pragma: no cover\n\n''' + marker
          if marker not in text:
              raise SystemExit('runtime stop marker not found')
          path.write_text(text.replace(marker, addition, 1))

          # Default agent lifecycle/concurrency wrapping for streams.
          path = Path('micro_agent/core/default_agent.py')
          text = path.read_text()
          text = text.replace('import asyncio\nfrom typing import Any\n', 'import asyncio\nfrom collections.abc import AsyncIterator\nfrom typing import Any\n')
          text = text.replace('    AgentState,\n', '    AgentState,\n    AgentStreamEvent,\n')
          marker = '''    async def stop(self) -> None:\n'''
          method = '''    async def stream(self, request: AgentRequest) -> AsyncIterator[AgentStreamEvent]:\n        """Stream while preserving the same lifecycle, contract, and concurrency guards."""\n        async with self._lifecycle_lock:\n            max_concurrency = self._definition.spec.runtime.max_concurrency\n            policy = self._definition.spec.runtime.concurrency_policy\n            while max_concurrency is not None and self._active_invocations >= max_concurrency:\n                if policy == ConcurrencyPolicy.REJECT:\n                    raise InvocationOverloadedError(max_concurrency)\n                await self._capacity_available.wait()\n            if self._state != AgentState.READY:\n                raise RuntimeError(f"Cannot invoke from state {self._state.value}")\n            if not self._runtime.capabilities().streaming:\n                raise RuntimeError("Runtime does not support streaming")\n            assert self._runtime_agent is not None\n            validate_input(self._definition.spec.behavior.input_contract, request.input)\n            runtime_agent = self._runtime_agent\n            self._active_invocations += 1\n            self._idle.clear()\n            current_task = asyncio.current_task()\n            if current_task is not None:\n                self._invocation_tasks.add(current_task)\n        try:\n            async for event in self._runtime.stream(runtime_agent, request):\n                if event.response is not None:\n                    validate_output(\n                        self._definition.spec.behavior.output_contract, event.response.output\n                    )\n                yield event\n        finally:\n            async with self._lifecycle_lock:\n                self._active_invocations -= 1\n                if current_task is not None:\n                    self._invocation_tasks.discard(current_task)\n                if self._active_invocations == 0:\n                    self._idle.set()\n                self._capacity_available.notify_all()\n\n'''
          if marker not in text:
              raise SystemExit('default agent stop marker not found')
          path.write_text(text.replace(marker, method + marker, 1))

          # Built-in runtime: provider capability + queue-backed stream + streaming model path.
          path = Path('runtimes/adk/runtime.py')
          text = path.read_text()
          text = text.replace('from collections.abc import Awaitable, Callable\n', 'from collections.abc import AsyncIterator, Awaitable, Callable\n')
          text = text.replace('    AgentResponse,\n', '    AgentResponse,\n    AgentStreamEvent,\n')
          text = text.replace('            streaming=False,\n', '            streaming=self._model_provider.capabilities().streaming,\n', 1)
          marker = '''    async def _invoke(self, agent: RuntimeAgent, request: AgentRequest) -> AgentResponse:\n'''
          stream_method = '''    async def stream(\n        self, agent: RuntimeAgent, request: AgentRequest\n    ) -> AsyncIterator[AgentStreamEvent]:\n        """Stream provider deltas and finish with the normal AgentResponse contract."""\n        if not self.capabilities().streaming:\n            raise RuntimeError("Runtime does not support streaming")\n        queue: asyncio.Queue[AgentStreamEvent | BaseException | None] = asyncio.Queue()\n\n        async def emit(delta: str) -> None:\n            if delta:\n                await queue.put(AgentStreamEvent(delta=delta))\n\n        async def run() -> None:\n            token = set_invocation_identity(\n                InvocationIdentity(\n                    caller=request.caller_identity,\n                    user=request.user_context,\n                    workload=self._workload_identity,\n                )\n            )\n            try:\n                response = await self._invoke(agent, request, emit_delta=emit)\n                await queue.put(AgentStreamEvent(response=response))\n            except BaseException as exc:\n                await queue.put(exc)\n            finally:\n                reset_invocation_identity(token)\n                await queue.put(None)\n\n        task = asyncio.create_task(run())\n        try:\n            while True:\n                item = await queue.get()\n                if item is None:\n                    break\n                if isinstance(item, BaseException):\n                    raise item\n                yield item\n        finally:\n            if not task.done():\n                task.cancel()\n            await asyncio.gather(task, return_exceptions=True)\n\n'''
          if marker not in text:
              raise SystemExit('runtime _invoke marker not found')
          text = text.replace(marker, stream_method + marker, 1)
          text = text.replace(
              '    async def _invoke(self, agent: RuntimeAgent, request: AgentRequest) -> AgentResponse:\n',
              '    async def _invoke(\n        self,\n        agent: RuntimeAgent,\n        request: AgentRequest,\n        emit_delta: Callable[[str], Awaitable[None]] | None = None,\n    ) -> AgentResponse:\n',
              1,
          )
          marker = '''        side_effect_state: dict[str, Any] = {"attempted_tools": []}\n'''
          replacement = marker + '''        emitted_stream_output = False\n\n        async def tracked_emit(delta: str) -> None:\n            nonlocal emitted_stream_output\n            if not delta or emit_delta is None:\n                return\n            emitted_stream_output = True\n            await emit_delta(delta)\n'''
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '                side_effect_state=side_effect_state,\n            )\n',
              '                side_effect_state=side_effect_state,\n                emit_delta=tracked_emit if emit_delta is not None else None,\n            )\n',
              1,
          )
          marker = '''        except Exception as exc:\n            self._telemetry.increment("agent_invocation_errors_total", labels)\n'''
          replacement = marker + '''            if emitted_stream_output:\n                self._telemetry.increment("agent_retries_suppressed_total", labels)\n                raise RuntimeError(\n                    "invocation failed after streaming output was emitted; "\n                    "retry/fallback suppressed"\n                ) from exc\n'''
          if marker not in text:
              raise SystemExit('runtime exception marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '        side_effect_state: dict[str, Any] | None = None,\n    ) -> AgentResponse:\n',
              '        side_effect_state: dict[str, Any] | None = None,\n        emit_delta: Callable[[str], Awaitable[None]] | None = None,\n    ) -> AgentResponse:\n',
              1,
          )
          old = '''            try:\n                model_call = model_provider.generate(\n                    model_config, messages, tools=tool_schemas or None\n                )\n                response = await deadline.run(model_call, cap=model_config.timeout_seconds)\n            except Exception as exc:\n'''
          new = '''            try:\n                if emit_delta is None:\n                    model_call = model_provider.generate(\n                        model_config, messages, tools=tool_schemas or None\n                    )\n                    response = await deadline.run(model_call, cap=model_config.timeout_seconds)\n                else:\n                    async def consume_stream():\n                        final_response = None\n                        async for event in model_provider.stream(\n                            model_config, messages, tools=tool_schemas or None\n                        ):\n                            if event.delta:\n                                await emit_delta(event.delta)\n                            if event.response is not None:\n                                final_response = event.response\n                        if final_response is None:\n                            raise RuntimeError("model stream ended without a final response")\n                        return final_response\n\n                    response = await deadline.run(\n                        consume_stream(), cap=model_config.timeout_seconds\n                    )\n            except Exception as exc:\n'''
          if old not in text:
              raise SystemExit('model generate block not found')
          path.write_text(text.replace(old, new, 1))

          # HTTP SSE transport: accepted only when runtime advertises actual streaming.
          path = Path('micro_agent/interoperability/http_api.py')
          text = path.read_text()
          text = text.replace('from fastapi.responses import JSONResponse\n', 'from fastapi.responses import JSONResponse, StreamingResponse\n')
          marker = '''def serialize_response(data: Any) -> str:\n'''
          helper = '''def _sse(name: str, payload: dict[str, Any]) -> str:\n    data = json.dumps(payload, default=str, separators=(",", ":"))\n    return f"event: {name}\\ndata: {data}\\n\\n"\n\n\nasync def _stream_invoke(agent: DefaultMicroAgent, request: AgentRequest, telemetry: Telemetry):\n    """Translate runtime-neutral stream events to the public SSE contract."""\n    try:\n        async for event in agent.stream(request):\n            if event.delta:\n                yield _sse("delta", {"delta": event.delta})\n            if event.response is not None:\n                response = event.response\n                telemetry.logger.info(\n                    "invoke stream completed",\n                    request_id=request.request_id,\n                    status=response.status,\n                )\n                yield _sse(\n                    "final",\n                    InvokeResponseModel(\n                        output=response.output,\n                        request_id=response.request_id,\n                        session_id=response.session_id,\n                        status=response.status,\n                        error=response.error,\n                        metadata=response.metadata,\n                    ).model_dump(),\n                )\n    except Exception:\n        telemetry.increment("http_streaming_errors_total", {"route": "/v1/invoke"})\n        yield _sse(\n            "error",\n            {"code": "stream_failed", "message": "Streaming invocation failed"},\n        )\n\n\n'''
          if marker not in text:
              raise SystemExit('serialize marker not found')
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '    async def invoke(request: InvokeRequestModel, http_request: Request) -> InvokeResponseModel:\n',
              '    async def invoke(request: InvokeRequestModel, http_request: Request) -> Any:\n',
              1,
          )
          marker = '''        telemetry.logger.info(\n            "invoke request",\n            request_id=agent_request.request_id,\n            session_id=request.session_id,\n            authenticated=identity is not None,\n        )\n        try:\n'''
          replacement = '''        telemetry.logger.info(\n            "invoke request",\n            request_id=agent_request.request_id,\n            session_id=request.session_id,\n            authenticated=identity is not None,\n        )\n        if _accepts_streaming(http_request):\n            return StreamingResponse(\n                _stream_invoke(agent, agent_request, telemetry),\n                media_type=STREAMING_MEDIA_TYPE,\n                headers={\n                    "Cache-Control": "no-cache",\n                    "X-Accel-Buffering": "no",\n                },\n            )\n        try:\n'''
          if marker not in text:
              raise SystemExit('invoke log marker not found')
          path.write_text(text.replace(marker, replacement, 1))

          # Backlog/docs/changelog.
          path = Path('TODO.md')
          text = path.read_text()
          text = text.replace(
              '''  - [ ] Add streaming behind a runtime/provider capability that is exercised by\n        the public transport rather than inferred from an SDK feature.\n''',
              '''  - [x] Add streaming behind a runtime/provider capability exercised by the\n        public HTTP transport: OpenAI-compatible SSE and opt-in fake-provider\n        streams flow through the runtime-neutral SPI to `/v1/invoke`; unsupported\n        providers/runtimes remain false, and retries are suppressed after output.\n''',
              1,
          )
          path.write_text(text)

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '### Runtime\n\n'
          addition = '''### Runtime\n\n- Added truthful end-to-end streaming for the built-in runtime: the model SPI\n  now has runtime-neutral stream events, OpenAI-compatible providers consume\n  chat-completions SSE (including tool-call deltas), the fake provider can opt\n  into deterministic chunks for CI, and `/v1/invoke` returns SSE only when the\n  selected runtime/provider actually supports it. Retries/fallback are\n  suppressed once stream output has been emitted to avoid duplicate content.\n'''
          if marker not in text:
              raise SystemExit('changelog marker not found')
          path.write_text(text.replace(marker, addition, 1))

          Path('docs/STREAMING.md').write_text('''# Streaming\n\nStreaming is capability-gated end to end. A client requests it with `Accept: text/event-stream` on `POST /v1/invoke`. If the selected runtime/provider does not implement streaming, the API returns HTTP 406 before invocation.\n\nWhen supported, the response is Server-Sent Events:\n\n- `delta` — provider content increment (`{"delta":"..."}`).\n- `final` — the complete normal invocation response, including request/session ids, metadata, tool results, and status.\n- `error` — a stable redacted streaming error if execution fails after the HTTP stream starts.\n\nThe OpenAI-compatible adapter uses the provider's chat-completions SSE protocol and reconstructs streamed tool calls before continuing the runtime tool loop. The built-in fake provider exposes streaming only when `stream_chunks` is explicitly configured. Google ADK remains `streaming=false` until its runtime-neutral transport path is implemented.\n\nOnce any output delta has been delivered, invocation-level retry/fallback is suppressed because replay could duplicate already-visible output.\n''')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: >-
          ruff format micro_agent/models/model.py micro_agent/models/__init__.py
          micro_agent/models/fake.py micro_agent/models/openai_compat.py
          micro_agent/core/agent.py micro_agent/core/__init__.py
          micro_agent/core/default_agent.py micro_agent/runtime/runtime.py
          runtimes/adk/runtime.py micro_agent/interoperability/http_api.py
          tests/test_streaming.py
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy micro_agent runtimes
      - name: Focused streaming tests
        run: pytest tests/test_streaming.py -q
      - name: Default tests
        run: pytest -m "not integration and not e2e and not otel and not adk" -q
      - name: Commit and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-runtime-streaming-runner.yml
          git add micro_agent runtimes tests TODO.md CHANGELOG.md docs/STREAMING.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add truthful runtime streaming"
          git pull --rebase origin feat/runtime-streaming-20260902
          git push origin HEAD:feat/runtime-streaming-20260902
