name: Temporary runtime checkpointing fix runner

on:
  push:
    branches: [feat/runtime-checkpointing-20260902]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-checkpointing-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply checkpointing implementation
        run: python .github/apply_checkpointing.py
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format micro_agent runtimes tests/test_checkpointing.py
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy micro_agent runtimes
      - name: Focused checkpoint tests
        run: pytest tests/test_checkpointing.py -q
      - name: Default tests
        run: pytest -m "not integration and not e2e and not otel and not adk" -q
      - name: Commit implementation and remove temporary files
        run: |
          git rm .github/workflows/temporary-runtime-checkpointing-runner.yml
          git rm .github/workflows/temporary-runtime-checkpointing-fix-runner.yml
          git rm .github/apply_checkpointing.py
          git add micro_agent runtimes tests TODO.md CHANGELOG.md docs/CHECKPOINTING.md mkdocs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add replay-safe runtime checkpointing"
          git pull --rebase origin feat/runtime-checkpointing-20260902
          git push origin HEAD:feat/runtime-checkpointing-20260902
