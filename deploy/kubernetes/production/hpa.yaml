apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: micro-agent
  labels:
    app: micro-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: micro-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
