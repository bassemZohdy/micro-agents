apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-agent
  labels:
    app: micro-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: micro-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: micro-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: micro-agent
          image: micro-agent:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MICRO_AGENT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: micro-agent-config
                  key: log-level
          envFrom:
            - secretRef:
                name: micro-agent-secrets
          volumeMounts:
            - name: agent-config
              mountPath: /etc/micro-agent
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: agent-config
          configMap:
            name: micro-agent-definition
      terminationGracePeriodSeconds: 30
