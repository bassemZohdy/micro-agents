apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-agent
  labels:
    app: micro-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: micro-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: micro-agent
    spec:
      securityContext:
        # The image supports arbitrary UIDs (OpenShift); do not pin one.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: micro-agent
          # Pin an immutable version tag or digest; never deploy :latest.
          # image: ghcr.io/bassemzohdy/micro-agents@sha256:<digest>
          image: ghcr.io/bassemzohdy/micro-agents:0.1.0
          args:
            - "--definition"
            - "/etc/micro-agent/agent.yaml"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MICRO_AGENT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: micro-agent-config
                  key: log-level
          envFrom:
            - secretRef:
                name: micro-agent-secrets
          volumeMounts:
            - name: agent-config
              mountPath: /etc/micro-agent
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: agent-config
          configMap:
            name: micro-agent-definition
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
