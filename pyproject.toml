[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-agents"
version = "0.1.0"
description = "Cloud-native, independently deployable AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["micro_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["runtimes/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
