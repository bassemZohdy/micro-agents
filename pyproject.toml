[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-agents"
version = "0.1.0"
description = "Cloud-native, independently deployable AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-PyYAML>=6.0.12,<7.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "mcp>=1.26,<2.0",
    "a2a-sdk>=0.3.25,<0.4",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.6,<10.0",
]
adk = [
    "google-adk==2.8.0",
]
auth = [
    "PyJWT[crypto]>=2.8,<3.0",
]
mcp = [
    "mcp>=1.26,<2.0",
]
redis = [
    "redis>=5.0,<6.0",
]
a2a = [
    "a2a-sdk>=0.3.25,<0.4",
]

[project.scripts]
micro-agent = "micro_agent.__main__:main"

[project.urls]
Homepage = "https://github.com/bassemZohdy/micro-agents"
Documentation = "https://bassemzohdy.github.io/micro-agents/"
Repository = "https://github.com/bassemZohdy/micro-agents"
Issues = "https://github.com/bassemZohdy/micro-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["micro_agent", "runtimes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests (real network service, MCP wiring)",
    "e2e: end-to-end tests (booted services, full invoke paths)",
    "adk: Google ADK adapter tests (requires the optional adk extra)",
]
